<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250" style="background:#050505; font-family:'Courier New', Courier, monospace;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d1ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <!-- Filters for glowing elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(250px); opacity: 0.3; }
    }
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes rotate-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotate-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      92% { transform: translate(0); }
      93% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
      94% { transform: translate(1px, -1px); }
      95% { transform: translate(0); }
    }
    @keyframes typing {
      0%, 100% { content: "SYSTEM_STATUS: STABLE"; }
      25% { content: "RUNTIME_MONITOR: ON "; }
      50% { content: "AST_INGESTION: OK    "; }
      75% { content: "MCP_GATEWAY: ACTIVE "; }
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Animation Classes */
    .animated-grid {
      animation: grid-pulse 4s ease-in-out infinite;
    }
    .laser-line {
      animation: scanline 6s linear infinite;
    }
    .status-light {
      animation: blink 1.5s steps(1) infinite;
    }
    .radar-circle-1 {
      animation: rotate-clockwise 20s linear infinite;
      transform-origin: 680px 125px;
    }
    .radar-circle-2 {
      animation: rotate-counter 12s linear infinite;
      transform-origin: 680px 125px;
    }
    .glitch-text {
      animation: glitch 8s linear infinite;
    }
    .typewriter::after {
      content: "";
      animation: typing 12s step-end infinite;
    }
    .cursor {
      animation: cursor-blink 1s step-end infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="250" fill="#040404"/>

  <!-- High Tech Grid Background -->
  <g class="animated-grid" stroke="#00ff41" stroke-width="0.5" opacity="0.3">
    <!-- Vertical Lines -->
    <line x1="50" y1="0" x2="50" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="150" y1="0" x2="150" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="250" y1="0" x2="250" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="350" y1="0" x2="350" y2="250"/>
    <line x1="400" y1="0" x2="400" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="500" y1="0" x2="500" y2="250"/>
    <line x1="550" y1="0" x2="550" y2="250"/>
    <line x1="600" y1="0" x2="600" y2="250"/>
    <line x1="650" y1="0" x2="650" y2="250"/>
    <line x1="700" y1="0" x2="700" y2="250"/>
    <line x1="750" y1="0" x2="750" y2="250"/>
    <!-- Horizontal Lines -->
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
  </g>

  <!-- Gradient Overlay (Grid fading to black at bottom) -->
  <rect width="100%" height="250" fill="url(#grid-grad)"/>

  <!-- Scanning Laser Line -->
  <g class="laser-line">
    <rect x="0" y="0" width="800" height="2" fill="url(#laser-grad)"/>
    <rect x="0" y="0" width="800" height="8" fill="url(#laser-grad)" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- HUD Accents and Border Frames -->
  <g stroke="#222222" stroke-width="1">
    <!-- Outer Box Corners -->
    <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00ff41" stroke-width="2"/>
    <path d="M 770 10 L 790 10 L 790 30" fill="none" stroke="#00ff41" stroke-width="2"/>
    <path d="M 10 220 L 10 240 L 30 240" fill="none" stroke="#00ff41" stroke-width="2"/>
    <path d="M 770 240 L 790 240 L 790 220" fill="none" stroke="#00ff41" stroke-width="2"/>
  </g>

  <!-- High Tech Status Panel (Left) -->
  <g transform="translate(30, 40)" font-size="10" fill="#a1a1aa">
    <text x="0" y="15" fill="#00ff41" font-weight="bold">SYSTEM RUNTIME MODULES</text>
    <text x="0" y="35">> CPU_ALLOC: STABLE</text>
    <text x="0" y="50">> GIT_STATUS: MONITORING</text>
    <text x="0" y="65">> DB_STATE: WAL_MODE</text>
    <text x="0" y="80">> FTS_INDEX: ONLINE</text>
    <text x="0" y="95">> CORE_DAEMON: ACTIVE [OK]</text>
    
    <!-- Mini diagnostic graph -->
    <rect x="0" y="115" width="120" height="30" fill="#121212" stroke="#222" />
    <path d="M 5 135 L 20 125 L 35 140 L 50 120 L 65 130 L 80 122 L 95 138 L 115 125" fill="none" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>
    <text x="5" y="160" font-size="8" fill="#555555">CONTEXT_TRAVERSAL_LATENCY</text>
  </g>

  <!-- Interactive Terminal Window HUD (Center) -->
  <g transform="translate(200, 30)">
    <!-- Terminal Box Header -->
    <rect x="0" y="0" width="400" height="20" fill="#121212" stroke="#222"/>
    <circle cx="10" cy="10" r="4" fill="#ef4444"/>
    <circle cx="22" cy="10" r="4" fill="#eab308"/>
    <circle cx="34" cy="10" r="4" fill="#22c55e"/>
    <text x="200" y="14" fill="#a1a1aa" font-size="10" text-anchor="middle">sahilos@kernel:~</text>

    <!-- Terminal Box Body -->
    <rect x="0" y="20" width="400" height="170" fill="#0a0a0a" fill-opacity="0.9" stroke="#222"/>
    
    <!-- Code Output -->
    <g font-size="11" fill="#ededed" xml:space="preserve">
      <text x="15" y="50" fill="#00ff41">guest@sahil-os:~$<tspan fill="white"> whoami</tspan></text>
      <text x="15" y="70" fill="#a1a1aa">Sahil Pal -- Software Engineer &amp; Systems Developer</text>
      
      <text x="15" y="95" fill="#00ff41">guest@sahil-os:~$<tspan fill="white"> cat focus.log</tspan></text>
      <text x="15" y="115" fill="#00d1ff">"Building production scaffolding &amp; local tools"</text>
      
      <!-- Blinking Status Line -->
      <text x="15" y="145" fill="#00ff41">guest@sahil-os:~$ <tspan fill="#ededed" class="typewriter"></tspan><tspan fill="#00ff41" class="cursor">_</tspan></text>
    </g>
  </g>

  <!-- High Tech Target radar overlay (Right) -->
  <g transform="translate(680, 125)" stroke="#00ff41" stroke-opacity="0.3" fill="none">
    <!-- Radar crosshairs -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke-width="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke-width="0.5"/>
    
    <!-- Clockwise rotating dials -->
    <g class="radar-circle-1">
      <circle cx="0" cy="0" r="50" stroke-dasharray="10 15" stroke-width="1"/>
      <circle cx="0" cy="0" r="65" stroke-dasharray="40 10 5 10" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="43" y2="25" stroke-width="1.5" filter="url(#glow)"/>
    </g>
    
    <!-- Counter-clockwise rotating outer dials -->
    <g class="radar-circle-2">
      <circle cx="0" cy="0" r="30" stroke-dasharray="5 5" stroke-width="0.8"/>
      <path d="M -58 0 A 58 58 0 0 1 0 -58" stroke="#00d1ff" stroke-width="2" filter="url(#glow)"/>
      <path d="M 58 0 A 58 58 0 0 1 0 58" stroke="#00d1ff" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- Glowing scanning dot -->
    <circle cx="43" cy="25" r="3" fill="#00ff41" filter="url(#glow)"/>
  </g>

  <!-- Diagnostic Signal Indicators (Far Right) -->
  <g transform="translate(760, 40)" stroke="#222" stroke-width="1">
    <text x="-15" y="-5" fill="#555555" font-size="8" text-anchor="end">CONN_SIG</text>
    <!-- Blinking network node lines -->
    <circle cx="0" cy="10" r="4" fill="#00ff41" class="status-light" filter="url(#glow)"/>
    <circle cx="0" cy="30" r="4" fill="#00d1ff" opacity="0.6"/>
    <circle cx="0" cy="50" r="4" fill="#8b5cf6" opacity="0.6"/>
  </g>

  <!-- Footer Stats HUD -->
  <g transform="translate(30, 235)" font-size="9" fill="#555555">
    <text x="0" y="0">SAHIL_OS [V2.5.0]</text>
    <text x="200" y="0" fill="#00ff41" opacity="0.7" font-weight="bold">● ACTIVE CONTEXT: ONLINE</text>
    <text x="740" y="0" text-anchor="end">LOC_ID: KJC_BGLR</text>
  </g>
</svg>
