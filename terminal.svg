<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320" style="background:#050505; font-family:'Courier New', Courier, monospace; border-radius: 8px;">
  <defs>
    <!-- Glowing Green Filter -->
    <filter id="green-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Base text styles */
    .term-text {
      font-size: 11px;
      fill: #ededed;
      opacity: 0;
    }
    
    .prompt {
      fill: #00ff41;
      font-weight: bold;
    }

    /* Keyframes */
    @keyframes fade-in-line {
      0% { opacity: 0; }
      1% { opacity: 1; }
      100% { opacity: 1; }
    }
    
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Animation assignments with delays */
    .c1 { animation: fade-in-line 20s infinite; animation-delay: 0.5s; }
    .o1 { animation: fade-in-line 20s infinite; animation-delay: 1.8s; }
    
    .c2 { animation: fade-in-line 20s infinite; animation-delay: 3.0s; }
    .o2-1 { animation: fade-in-line 20s infinite; animation-delay: 4.5s; }
    .o2-2 { animation: fade-in-line 20s infinite; animation-delay: 4.8s; }
    .o2-3 { animation: fade-in-line 20s infinite; animation-delay: 5.1s; }
    .o2-4 { animation: fade-in-line 20s infinite; animation-delay: 5.4s; }
    .o2-5 { animation: fade-in-line 20s infinite; animation-delay: 5.7s; }
    .o2-6 { animation: fade-in-line 20s infinite; animation-delay: 6.0s; }
    .o2-7 { animation: fade-in-line 20s infinite; animation-delay: 6.3s; }
    .o2-8 { animation: fade-in-line 20s infinite; animation-delay: 6.6s; }
    .o2-9 { animation: fade-in-line 20s infinite; animation-delay: 6.9s; }
    .o2-10 { animation: fade-in-line 20s infinite; animation-delay: 7.2s; }
    .o2-11 { animation: fade-in-line 20s infinite; animation-delay: 7.5s; }
    .o2-12 { animation: fade-in-line 20s infinite; animation-delay: 7.8s; }
    .o2-13 { animation: fade-in-line 20s infinite; animation-delay: 8.1s; }
    .o2-14 { animation: fade-in-line 20s infinite; animation-delay: 8.4s; }
    .o2-15 { animation: fade-in-line 20s infinite; animation-delay: 8.7s; }
    
    .c3 { animation: fade-in-line 20s infinite; animation-delay: 10.0s; }
    .o3 { animation: fade-in-line 20s infinite; animation-delay: 11.5s; }
    
    .c4 { animation: fade-in-line 20s infinite; animation-delay: 13.0s; }

    /* Cursor styles */
    .term-cursor {
      fill: #00ff41;
      animation: cursor-blink 1s step-end infinite;
    }
  </style>

  <!-- Window Frame -->
  <rect x="0" y="0" width="800" height="320" rx="6" fill="#080808" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="800" height="24" rx="6" fill="#121212" stroke="#1f2937" stroke-width="1"/>
  
  <!-- Window buttons -->
  <circle cx="15" cy="12" r="4" fill="#ef4444"/>
  <circle cx="27" cy="12" r="4" fill="#eab308"/>
  <circle cx="39" cy="12" r="4" fill="#22c55e"/>
  
  <!-- Terminal Title -->
  <text x="400" y="15" fill="#888888" font-size="9" text-anchor="middle">guest@sahil-os:~ (synap)</text>

  <!-- Console Contents -->
  <g xml:space="preserve">
    <!-- Command 1 -->
    <text x="15" y="45" class="term-text c1"><tspan class="prompt">guest@sahil-os:~$</tspan> whoami</text>
    <!-- Output 1 -->
    <text x="15" y="60" class="term-text o1" fill="#888888">Sahil Pal -- Software Engineer &amp; Systems Developer</text>

    <!-- Command 2 -->
    <text x="15" y="80" class="term-text c2"><tspan class="prompt">guest@sahil-os:~$</tspan> synap mcp config</text>
    <!-- Output 2 (JSON) -->
    <text x="15" y="95" class="term-text o2-1" fill="#00d1ff">{</text>
    <text x="15" y="107" class="term-text o2-2" fill="#00d1ff">  "mcpServers": {</text>
    <text x="15" y="119" class="term-text o2-3" fill="#00d1ff">    "synap": {</text>
    <text x="15" y="131" class="term-text o2-4" fill="#00d1ff">      "command": "/Users/nitrousoxide/.local/share/uv/tools/synap-git/bin/python3",</text>
    <text x="15" y="143" class="term-text o2-5" fill="#00d1ff">      "args": [</text>
    <text x="15" y="155" class="term-text o2-6" fill="#00d1ff">        "-m",</text>
    <text x="15" y="167" class="term-text o2-7" fill="#00d1ff">        "synap_git.cli",</text>
    <text x="15" y="179" class="term-text o2-8" fill="#00d1ff">        "mcp",</text>
    <text x="15" y="191" class="term-text o2-9" fill="#00d1ff">        "start",</text>
    <text x="15" y="203" class="term-text o2-10" fill="#00d1ff">        "/Users/nitrousoxide/Code/saahilpal"</text>
    <text x="15" y="215" class="term-text o2-11" fill="#00d1ff">      ],</text>
    <text x="15" y="227" class="term-text o2-12" fill="#00d1ff">      "autoConnect": true</text>
    <text x="15" y="239" class="term-text o2-13" fill="#00d1ff">    }</text>
    <text x="15" y="251" class="term-text o2-14" fill="#00d1ff">  }</text>
    <text x="15" y="263" class="term-text o2-15" fill="#00d1ff">}</text>

    <!-- Command 3 -->
    <text x="15" y="283" class="term-text c3"><tspan class="prompt">guest@sahil-os:~$</tspan> synap status</text>
    <!-- Output 3 -->
    <text x="15" y="298" class="term-text o3" fill="#00ff41" filter="url(#green-glow)">● DAEMON_ACTIVE [PID 4059] // MCP_AUTO_CONNECT_SUCCESS // WAL_LOCK_FREE</text>

    <!-- Empty prompt at bottom -->
    <text x="15" y="313" class="term-text c4"><tspan class="prompt">guest@sahil-os:~$</tspan><rect x="145" y="303" width="6" height="11" class="term-cursor"/></text>
  </g>
</svg>
